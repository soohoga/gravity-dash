<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gravity Dash: Online Cloud Edition</title>
    <!-- Firebase SDK 불러오기 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        canvas { background: #050505; border: 3px solid #00ff88; box-shadow: 0 0 50px rgba(0, 255, 136, 0.3); }
        #ui { position: absolute; text-align: center; width: 100%; z-index: 10; pointer-events: none; }
        .menu { pointer-events: auto; background: rgba(0,0,0,0.95); padding: 30px; border-radius: 20px; border: 2px solid #333; width: 600px; margin: auto; }
        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 15px; max-height: 350px; overflow-y: auto; padding: 10px; }
        button { padding: 12px; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; background: #222; color: #fff; font-weight: bold; }
        button.active-diff { background: #00ff88 !important; color: #000; box-shadow: 0 0 15px #00ff88; transform: scale(1.05); }
        button.level-btn { background: #111; border: 1px solid #444; position: relative; }
        button.level-btn:hover { background: #00ff88; color: #000; transform: scale(1.05); }
        .difficulty-nav { display: flex; gap: 10px; margin-bottom: 15px; }
        .difficulty-nav button { flex: 1; font-size: 16px; border: 1px solid #333; }
        h1 { color: #fff; text-shadow: 0 0 15px #00ff88; margin: 0; font-style: italic; font-size: 40px; }
        .stats { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 28px; font-weight: bold; color: #fff; pointer-events: none; }
        .progress-bar-container { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 600px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        input { padding: 12px; margin: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #111; color: white; width: 80%; }
        .user-info { margin-bottom: 15px; font-size: 16px; color: #00ff88; display: flex; justify-content: space-between; align-items: center; background: rgba(0,255,136,0.1); padding: 10px; border-radius: 6px; }
        .logout-btn { background: #ff4444; font-size: 12px; padding: 6px 12px; }
        .logout-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

<div id="ui">
    <!-- 로그인 화면 -->
    <div id="loginMenu" class="menu">
        <h1>GRAVITY DASH</h1>
        <p style="color: #00ff88; font-size: 16px; margin: 15px 0;">온라인 클라우드 로그인 / 자동 회원가입</p>
        <input type="text" id="userIdInput" placeholder="아이디 입력"><br>
        <input type="password" id="userPwInput" placeholder="비밀번호 입력"><br><br>
        <button onclick="loginUser()" style="background: #00ff88; color: #000; width: 85%; font-size: 18px;">로그인 및 게임 시작</button>
    </div>

    <!-- 메인 게임 메뉴 (로그인 후 표시) -->
    <div id="mainMenu" class="menu" style="display: none;">
        <div class="user-info">
            <span>용사님: <b id="displayNameDisp"></b></span>
            <button class="logout-btn" onclick="logoutUser()">로그아웃</button>
        </div>
        <h1>GRAVITY DASH</h1>
        <p style="color: #00ff88; font-size: 18px; margin: 10px 0;">난이도를 선택하고 기록을 세우세요!</p>
        <div class="difficulty-nav">
            <button id="dBtn1" onclick="setDiff(1)">EASY</button>
            <button id="dBtn2" onclick="setDiff(2)">NORMAL</button>
            <button id="dBtn3" onclick="setDiff(3)">HARD</button>
        </div>
        <div id="levelGrid" class="level-grid"></div>
    </div>
</div>

<div class="stats" id="hud" style="display:none;">
    LV <span id="curLvlDisp">1</span> - <span id="progressTxt">0</span>%
    <div style="font-size: 18px; color: #aaa;">BEST: <span id="bestInGame">0</span>%</div>
    <div class="progress-bar-container"><div id="progress-fill"></div></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    // ⚙️ [설정] 본인의 파이어베이스 설정 정보를 아래에 입력하세요!
    const firebaseConfig = {
        apiKey: "AIzaSyBF-A3uWjwJ5MlB7pu3rdMm2xaxvryYnTI",
        authDomain: "play-game-with-my-friends-1.firebaseapp.com",
        databaseURL: "https://play-game-with-my-friends-1-default-rtdb.firebaseio.com",
        projectId: "play-game-with-my-friends-1",
        storageBucket: "play-game-with-my-friends-1.firebasestorage.app",
        messagingSenderId: "425078816315",
        appId: "1:425078816315:web:a1536ccc42ad745753a61e"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentUser = null;
    let highScores = {};

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 1200;
    canvas.height = 700;

    let currentDiff = 1;
    let currentLvl = 1;
    let gameRunning = false;
    let frame = 0;
    let progress = 0;
    let gameSpeed = 6;
    let levelMap = [];

    const player = { x: 200, y: 350, w: 45, h: 45, v: 0, gravity: 0.65, up: false, rot: 0 };

    // 로그인 및 회원가입 처리 함수
    function loginUser() {
        const id = document.getElementById('userIdInput').value.trim();
        const pw = document.getElementById('userPwInput').value.trim();

        if (!id || !pw) {
            alert("아이디와 비밀번호를 모두 입력해 주세요!");
            return;
        }

        database.ref('gravity_users/' + id).once('value').then((snapshot) => {
            const userData = snapshot.val();

            if (userData) {
                if (userData.pw !== pw) {
                    alert("비밀번호가 틀렸습니다!");
                    return;
                }
                highScores = userData.scores || {};
            } else {
                highScores = {};
                database.ref('gravity_users/' + id).set({ pw: pw, scores: {} });
                alert("새로운 계정이 생성되었습니다!");
            }

            currentUser = id;
            document.getElementById('displayNameDisp').innerText = currentUser;
            document.getElementById('loginMenu').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            setDiff(1);
        }).catch((error) => {
            alert("서버 통신 중 오류가 발생했습니다: " + error.message);
        });
    }

    function logoutUser() {
        currentUser = null;
        highScores = {};
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('loginMenu').style.display = 'block';
        document.getElementById('userIdInput').value = '';
        document.getElementById('userPwInput').value = '';
    }

    function setDiff(d) {
        currentDiff = d;
        for(let i=1; i<=3; i++) {
            document.getElementById('dBtn' + i).classList.remove('active-diff');
        }
        document.getElementById('dBtn' + d).classList.add('active-diff');
        renderLevels();
    }

    function renderLevels() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 50; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            const best = highScores[`${currentDiff}-${i}`] || 0;
            btn.innerHTML = `${i}<br><span style="font-size:10px; color:#00ff88;">${best}%</span>`;
            btn.onclick = () => startLevel(i);
            grid.appendChild(btn);
        }
    }

    function startLevel(lvl) {
        currentLvl = lvl;
        progress = 0;
        frame = 0;
        player.y = 350; player.v = 0; player.up = false; player.rot = 0;
        gameSpeed = 5.5 + (currentDiff * 1.3) + (lvl * 0.02);
        levelMap = generateLevelMap(lvl);
        document.getElementById('bestInGame').innerText = highScores[`${currentDiff}-${currentLvl}`] || 0;
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('curLvlDisp').innerText = `${currentDiff}-${lvl}`;
        gameRunning = true;
        animate();
    }

    function generateLevelMap(lvlSeed) {
        let map = [];
        let totalLength = 7000;
        let seed = lvlSeed * 77 + currentDiff * 999;
        for (let x = 1000; x < totalLength * 15; x += 300 + seededRandom(seed++) * 400) {
            let rand = seededRandom(seed++);
            let type = 'spike';
            if (rand > 0.85) type = 'tripleSpike';
            else if (rand > 0.7) type = 'pillar';
            else if (rand > 0.5) type = 'saw';
            else if (rand > 0.3) type = 'gate';
            let isTop = seededRandom(seed++) > 0.5;
            let obs = { x: x, type: type, isTop: isTop, w: 50, h: 100 };
            if (type === 'tripleSpike') obs.w = 150;
            if (type === 'pillar') { obs.h = 220 + seededRandom(seed++) * 120; obs.w = 60; }
            if (type === 'saw') { obs.y = 150 + seededRandom(seed++) * 400; obs.w = 80; obs.h = 80; }
            if (type === 'gate') { obs.w = 60; obs.h = 220; } 
            map.push(obs);
        }
        return map;
    }

    function gameOver() {
        gameRunning = false;
        const scoreKey = `${currentDiff}-${currentLvl}`;
        const curProg = Math.floor(progress);
        if (!highScores[scoreKey] || curProg > highScores[scoreKey]) {
            highScores[scoreKey] = curProg;
            // 구글 클라우드에 최고 기록 실시간 저장
            database.ref('gravity_users/' + currentUser + '/scores').set(highScores);
        }
        alert(`게임 종료! (${curProg}%)`);
        document.getElementById('mainMenu').style.display = 'block';
        document.getElementById('hud').style.display = 'none';
        renderLevels();
    }

    function seededRandom(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

    function animate() {
        if (!gameRunning) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        player.v += player.up ? -player.gravity : player.gravity;
        player.y += player.v;
        if (player.y < 0) { player.y = 0; player.v = 0; }
        if (player.y + player.h > canvas.height) { player.y = canvas.height - player.h; player.v = 0; }

        levelMap.forEach((obs) => {
            let screenX = obs.x - (frame * gameSpeed);
            if (screenX < -200 || screenX > canvas.width + 200) return;
            ctx.fillStyle = "#ff4444";
            if (obs.type === 'spike' || obs.type === 'tripleSpike') {
                let count = obs.type === 'spike' ? 1 : 3;
                for(let j=0; j<count; j++) {
                    let ox = screenX + (j * 45); ctx.beginPath();
                    if (obs.isTop) { ctx.moveTo(ox, 0); ctx.lineTo(ox + 45, 0); ctx.lineTo(ox + 22.5, obs.h); }
                    else { ctx.moveTo(ox, canvas.height); ctx.lineTo(ox + 45, canvas.height); ctx.lineTo(ox + 22.5, canvas.height - obs.h); }
                    ctx.fill();
                }
            } else if (obs.type === 'pillar' || obs.type === 'gate') {
                let y = obs.isTop ? 0 : canvas.height - obs.h;
                if (obs.type === 'gate') { ctx.fillRect(screenX, 0, obs.w, 200); ctx.fillRect(screenX, canvas.height - 200, obs.w, 200); }
                else { ctx.fillRect(screenX, y, obs.w, obs.h); }
            } else if (obs.type === 'saw') {
                ctx.save(); ctx.translate(screenX + obs.w/2, obs.y + obs.h/2); ctx.rotate(frame * 0.1);
                ctx.fillStyle = "#fff"; for(let j=0; j<8; j++) { ctx.rotate(Math.PI/4); ctx.fillRect(-3, -obs.h/2, 6, obs.h); }
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.restore();
            }
            let m = 15; let hx = screenX + m, hw = obs.w - (m * 2);
            if (player.x < hx + hw && player.x + player.w > hx) {
                if (obs.type === 'saw') { if (player.y + m < obs.y + obs.h && player.y + player.h - m > obs.y) gameOver(); }
                else if (obs.type === 'gate') { if (player.y + m < 200 || player.y + player.h - m > canvas.height - 200) gameOver(); }
                else { if (obs.isTop && player.y + m < obs.h) gameOver(); if (!obs.isTop && player.y + player.h - m > canvas.height - obs.h) gameOver(); }
            }
        });

        ctx.save(); ctx.translate(player.x + player.w/2, player.y + player.h/2); player.rot += 0.1; ctx.rotate(player.rot);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
        ctx.fillStyle = "rgba(0, 255, 136, 0.6)"; ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h); ctx.restore();

        progress = (frame * gameSpeed / 75000) * 100;
        let p = Math.min(100, progress);
        document.getElementById('progressTxt').innerText = Math.floor(p);
        document.getElementById('progress-fill').style.width = p + "%";
        if (progress >= 100) { 
            highScores[`${currentDiff}-${currentLvl}`] = 100; 
            database.ref('gravity_users/' + currentUser + '/scores').set(highScores);
            alert("🎉 클리어!"); 
            gameOver(); 
        }
        frame++; requestAnimationFrame(animate);
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Insert' && gameRunning) {
            progress = 0; frame = 0; player.y = 350; player.v = 0; player.up = false; player.rot = 0;
        }
        if (e.code === 'Space' || e.code === 'ArrowUp') player.up = !player.up;
    });

    canvas.addEventListener('mousedown', () => { if(gameRunning) player.up = !player.up; });
</script>
</body>
</html>
